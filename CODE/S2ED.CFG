; S2ED CONFIGURATION FILE
; PROFILE: STD, WS, EMC, VI
PROFILE=STD
; WRAP: DEV, TXT
WRAP=TXT
; MARKUP: OFF, MD, LIT
MARKUP=MD
; CLOCK: 0=OFF, 1=ON
CLOCK=1
; TABWIDTH: 2, 4, 8
TABWIDTH=4
; EOL: AUTO, DOS, UNIX
EOL=AUTO
; AUTOALIGN: OFF, ON, or DEV (ON only when WRAP=DEV)
AUTOALIGN=OFF
; THEME: DARK, GREEN, AMBER, MSX
THEME=DARK
; SHADOW: OFF, or one TMS9918 colour 0-F for the window drop shadow.
;   A shadow cell keeps the document's pattern and only flattens its colour,
;   so it shows only where it differs from the document background.
;   1=black 4=dark blue 6=dark red C=dark green E=gray
;   Unset, each theme brings its own.
;SHADOW=4
